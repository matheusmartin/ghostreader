<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: draw under the notch and the home indicator; the CSS keeps text in the safe area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Read books with charts, infographics and summaries." />
    <meta name="theme-color" content="#fafafa" />
    <!-- Page colour before the first paint, so it never flashes. Same rules as src/lib/scheme.ts. -->
    <script>
      (function () {
        var ok = ['paper', 'quiet', 'warm', 'dusk', 'night'], c = 'auto';
        try { c = localStorage.getItem('ghostwriter:scheme') || 'auto'; } catch (e) {}
        if (ok.indexOf(c) < 0) c = matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk' : 'paper';
        document.documentElement.setAttribute('data-scheme', c);
      })();
    </script>
    <!-- iPhone and iPad: full screen when opened from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ghostwriter" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Ghostwriter</title>
  </head>
  <body>
    <!-- Arrow head for SVG figures (classes ar, ara). It takes the colour of the line. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="context-stroke" />
        </marker>
      </defs>
    </svg>
    <div id="app"></div>
    <noscript>Ghostwriter needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
