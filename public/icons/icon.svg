<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A book map: one row per part, one chip per chapter, the current chapter as the key. -->
  <rect width="512" height="512" rx="112" fill="#1d2433"/>
  <g transform="translate(96 132)">
    <rect x="0" y="0" width="92" height="60" rx="16" fill="#f0a48f"/>
    <rect x="104" y="0" width="60" height="60" rx="16" fill="#f0a48f"/>
    <rect x="176" y="0" width="144" height="60" rx="16" fill="#f0a48f"/>
    <rect x="0" y="94" width="132" height="60" rx="16" fill="#8fd6d0"/>
    <rect x="144" y="94" width="76" height="60" rx="16" fill="#fbf8f2"/>
    <rect x="232" y="94" width="88" height="60" rx="16" fill="#8fd6d0" fill-opacity=".35"/>
    <rect x="0" y="188" width="70" height="60" rx="16" fill="#b8b0ec" fill-opacity=".35"/>
    <rect x="82" y="188" width="110" height="60" rx="16" fill="#b8b0ec" fill-opacity=".35"/>
    <rect x="204" y="188" width="116" height="60" rx="16" fill="#b8b0ec" fill-opacity=".35"/>
  </g>
</svg>
